[metadata]
name = rdp-package
version = 0.3.0
description = RDP Cython package + optional rdp_adaptive_cpp (C++/AVX2)
url = https://github.com/amirkazan/rdp-package
classifiers =
    Programming Language :: Python :: 3
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent

[options]
packages = find:
python_requires = >=3.6
install_requires =
    numpy
